[project]
name = "vgen-eval"
version = "0.1.0"
description = "Local evaluation platform for video-generation models on Tokenbay"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "av>=13.0",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
vgen = "vgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
