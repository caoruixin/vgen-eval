# Stage 1 of /etc/nginx/conf.d/vgen.conf: port 80 only, so certbot can prove video.llm-pro.cn before the
# HTTPS server (which needs the certificate) exists. deploy/provision.sh replaces it with nginx-vgen.conf.
server {
    listen 80;
    server_name video.llm-pro.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/vgen-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
