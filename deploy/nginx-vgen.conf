# vgen·eval hosted demo: https://video.llm-pro.cn → 127.0.0.1:8790 (vgen.service).
# Installed as /etc/nginx/conf.d/vgen.conf by deploy/provision.sh. It only adds servers for video.llm-pro.cn;
# the llm-pro.cn site (llms-study.conf) and the knowledge base on :8443 (tokenbay-kb.conf) are not touched.
limit_req_zone $binary_remote_addr zone=vgen_req:10m rate=240r/m;

server {
    listen 80;
    server_name video.llm-pro.cn;

    # renewals use the webroot, so they don't depend on the nginx certbot plugin
    location /.well-known/acme-challenge/ {
        root /var/www/vgen-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name video.llm-pro.cn;

    ssl_certificate /etc/letsencrypt/live/video.llm-pro.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.llm-pro.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;          # uploads; the app itself caps them at 20 MB
    add_header Strict-Transport-Security "max-age=31536000" always;

    # UI bundle: hashed file names, so browsers can keep them (gzip comes from nginx.conf's gzip_types)
    location /assets/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        # the run board polls every few seconds and players fetch clips in ranges: generous per-IP limit
        limit_req zone=vgen_req burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;       # key checks and run creation call Tokenbay
        proxy_max_temp_file_size 0;    # stream clips instead of spooling them to disk
    }
}
